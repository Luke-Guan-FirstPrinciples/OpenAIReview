  const claimChecks = comments.filter(c => !hallucinations.includes(c));
  panel.innerHTML = `<div class="comment-panel-content panel-stack">
    <div class="review-section-card">
      <div class="section-eyebrow">Citation</div>
      <div class="section-title">CiteVerify Results</div>
      <div class="section-body">${renderMarkdownWithMath(citationMethod.overall_feedback || 'Citation verification completed.')}</div>
    </div>
    <div class="citation-split">
      <div class="citation-card">
        <div class="section-eyebrow">Citation Hallucination Detection</div>
        ${hallucinations.length ? hallucinations.map(renderCitationCard).join('') : '<div class="empty-state">No citation hallucination findings.</div>'}
      </div>
      <div class="citation-card">
        <div class="section-eyebrow">Claim Citation Verification</div>
        ${claimChecks.length ? claimChecks.map(renderCitationCard).join('') : '<div class="empty-state">No claim-citation support findings.</div>'}
      </div>
    </div>
    ${citationMethod.verifier_outputs ? renderVerifierOutputs(citationMethod.verifier_outputs) : ''}
  </div>`;
  typesetElement(panel);
}

function renderCitationCard(c) {
  return `<div class="comment-card" id="card-${c.id}" data-id="${c.id}">
    <div class="card-header">
      <span class="card-title">${escapeHtml(c.title)}</span>
      ${c.severity ? `<span class="badge ${c.severity}">${c.severity}</span>` : ''}
      ${c.verification_status ? `<span class="badge ${c.verification_status}">${c.verification_status.replaceAll('_', ' ')}</span>` : ''}
    </div>
    ${c.claim ? `<div class="explanation"><strong>Claim:</strong> ${renderMarkdownWithMath(c.claim)}</div>` : ''}
    ${c.quote ? `<div class="quote">${renderMarkdownWithMath(wrapBareLaTeX(c.quote))}</div>` : ''}
    ${c.evidence ? `<div class="explanation"><strong>Evidence:</strong> ${renderMarkdownWithMath(c.evidence)}</div>` : ''}
    ${c.explanation ? `<div class="explanation">${renderMarkdownWithMath(c.explanation)}</div>` : ''}
  </div>`;
}

function renderCommentCard(c) {
  const isResolved = resolvedIds.has(c.id);
  const paraLink = c.paragraph_index != null
    ? `<span class="para-link">\u00b6 ${c.paragraph_index}</span>`
    : '<span class="para-link unlocated">unlocated</span>';

  const quoteText = c.quote || '';
  const explanationText = c.explanation || c.message || '';

  let badges = '';
  if (c.severity) badges += `<span class="badge ${c.severity}">${c.severity}</span>`;
  if (c.verification_status) badges += `<span class="badge ${c.verification_status}">${c.verification_status.replaceAll('_', ' ')}</span>`;
  if (c.confidence) badges += `<span class="badge confidence">${c.confidence}</span>`;
  if (c.rubric_dimension) badges += `<span class="badge dimension">${escapeHtml(c.rubric_dimension.replaceAll('_', ' '))}</span>`;

  const resolveBtn = `<button class="resolve-btn${isResolved ? ' is-resolved' : ''}" data-resolve-id="${c.id}" title="${isResolved ? 'Mark as open' : 'Mark as resolved'}">✓</button>`;

  return `<div class="comment-card${isResolved ? ' resolved' : ''}" id="card-${c.id}" data-id="${c.id}">
    <div class="card-header">
      <span class="card-title">${escapeHtml(c.title)}</span>
      ${badges}
      ${resolveBtn}
    </div>
    ${quoteText ? `<div class="quote">${renderMarkdownWithMath(wrapBareLaTeX(quoteText))}</div>` : ''}
    ${c.claim ? `<div class="explanation"><strong>Claim:</strong> ${renderMarkdownWithMath(c.claim)}</div>` : ''}
    ${c.evidence ? `<div class="explanation"><strong>Evidence:</strong> ${renderMarkdownWithMath(c.evidence)}</div>` : ''}
    ${explanationText ? `<div class="explanation">${renderMarkdownWithMath(explanationText)}</div>` : ''}
    ${paraLink}
    ${renderFeedbackWidget(c.id)}
  </div>`;
}

function renderVerifierOutputs(outputs) {
  const cards = [];
  if (outputs.method_insight_miner) {
    cards.push(renderVerifierCard('Method Insight Miner', outputs.method_insight_miner));
  }
  if (outputs.results_analyzer) {
    cards.push(renderVerifierCard('Results Analyzer', outputs.results_analyzer));
  }
  if (outputs.related_work_searcher) {
    cards.push(renderVerifierCard('Related Work Searcher', outputs.related_work_searcher));
  }
  if (outputs.novelty_delta) {
    cards.push(renderVerifierCard('Novelty Delta', outputs.novelty_delta));
  }
  if (outputs.refutation_checker) {
    cards.push(renderVerifierCard('Refutation Checker', outputs.refutation_checker));
  }
  if (cards.length === 0) return '';
  return `<div class="verifier-section">
    <h3>Intermediate Verifier Outputs</h3>
    <details class="verifier-details">
      <summary>Show grounding steps</summary>
      <div class="verifier-grid">${cards.join('')}</div>
    </details>
  </div>`;
}

function renderVerifierCard(title, data) {
  const summary = summarizeVerifierData(data);
  return `<div class="verifier-card">
    <div class="verifier-card-title">${escapeHtml(title)}</div>
    ${summary ? `<div class="verifier-card-meta">${escapeHtml(summary)}</div>` : ''}
    <pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre>
  </div>`;
}

function summarizeVerifierData(data) {
  if (!data || typeof data !== 'object') return '';
  if (data.candidate_count !== undefined) {
    return `${data.surviving_count || 0} surviving issues from ${data.candidate_count} candidates`;
  }
  if (Array.isArray(data.related_papers)) {
    return `${data.related_papers.length} related papers`;
  }
  const counts = Object.entries(data)
    .filter(([, value]) => Array.isArray(value))
    .map(([key, value]) => `${value.length} ${key.replaceAll('_', ' ')}`);
  return counts.slice(0, 3).join(', ');
}

function wrapBareLaTeX(text) {
  if (!text) return text;
  if (text.includes('$')) return text;
  if (/\\[a-zA-Z]/.test(text)) {
    if (text.includes('&')) return '$$\\begin{aligned}' + text + '\\end{aligned}$$';
    return '$' + text + '$';
  }
  return text;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

document.addEventListener('DOMContentLoaded', init);
</script>
